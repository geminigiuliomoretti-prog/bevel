name: Native tests

on:
  push:
  pull_request:

jobs:
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift package tests
        working-directory: native/ios/BeveltryBLE
        run: swift test

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Kotlin module tests
        working-directory: native/android
        run: bash gradlew :beveltry-ble:testDebugUnitTest
      - name: Compile manual Android instrumentation test (not executed)
        working-directory: native/android
        run: bash gradlew :beveltry-ble:assembleDebugAndroidTest

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Run Flutter tests
        working-directory: app
        run: flutter test
