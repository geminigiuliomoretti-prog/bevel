name: Native tests

on:
  push:
  pull_request:

jobs:
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift package tests
        working-directory: native/ios/BeveltryBLE
        run: swift test

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Kotlin module tests
        working-directory: native/android
        run: bash gradlew :beveltry-ble:testDebugUnitTest
      - name: Compile manual Android instrumentation test (not executed)
        working-directory: native/android
        run: |
          set -o pipefail
          set +e
          bash gradlew :beveltry-ble:assembleDebugAndroidTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/android-test-build.log"
          result=$?
          if [ "$result" -ne 0 ]; then
            tail -n 24 "$RUNNER_TEMP/android-test-build.log" | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$result"

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Run Flutter tests
        working-directory: app
        run: flutter test
